<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Shooter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#05010f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function(){
  // لو النت شغال ولينك الموقع متاح، حوّل المستخدم للنسخة الأونلاين.
  // لو مفيش نت أو فشل الاتصال، اللعبة المحلية المدمجة هنا هتشتغل عادي.
  var ONLINE_URL = 'https://www.shoto.online/p/shoto.html';
  var TIMEOUT_MS = 2200;

  function checkOnline(cb){
    var done = false;
    var timer = setTimeout(function(){
      if(!done){ done = true; cb(false); }
    }, TIMEOUT_MS);

    try{
      fetch(ONLINE_URL, { method:'GET', mode:'no-cors', cache:'no-store' })
        .then(function(){ if(!done){ done = true; clearTimeout(timer); cb(true); } })
        .catch(function(){ if(!done){ done = true; clearTimeout(timer); cb(false); } });
    }catch(e){
      if(!done){ done = true; clearTimeout(timer); cb(false); }
    }
  }

  checkOnline(function(isOnline){
    if(isOnline){
      window.location.replace(ONLINE_URL);
    }
    // مفيش نت / فشل الاتصال -> نسيب الصفحة المحلية تكمل تحميل عادي
  });
})();
</script>
<style>
  :root{
    --neon-cyan:#00f6ff; --neon-pink:#ff2bd6; --neon-purple:#8b2bff;
    --bg:#05010f;
  }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
    font-family:'Courier New',monospace;color:#fff;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  #wrap{position:relative;width:100%;height:100vh;height:100dvh;}
  canvas{display:block;width:100%;height:100%;background:#05010f;cursor:crosshair;touch-action:none;}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(20,0,40,.85), rgba(0,0,0,.95));
    text-align:center;gap:18px;z-index:5;}
  .hidden{display:none !important;}
  h1{font-size:clamp(28px,6vw,54px);margin:0;letter-spacing:4px;
    color:var(--neon-cyan);text-shadow:0 0 10px var(--neon-cyan),0 0 30px var(--neon-purple);}
  p.sub{color:#9db0d0;max-width:520px;margin:0;font-size:14px;line-height:1.6;}
  button{
    font-family:inherit;font-size:18px;letter-spacing:2px;padding:14px 38px;
    background:transparent;color:var(--neon-cyan);border:2px solid var(--neon-cyan);
    border-radius:6px;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 12px rgba(0,246,255,.5) inset,0 0 12px rgba(0,246,255,.3);
    transition:.15s;}
  button:hover{background:var(--neon-cyan);color:#05010f;box-shadow:0 0 25px var(--neon-cyan);}
  #finalScore{color:var(--neon-pink);text-shadow:0 0 10px var(--neon-pink);font-size:22px;}

  #hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 20px;z-index:4;pointer-events:none;font-size:14px;}
  #hud .box{background:rgba(10,0,25,.55);border:1px solid rgba(0,246,255,.3);border-radius:6px;
    padding:8px 14px;backdrop-filter:blur(3px);}
  #scoreBox{color:var(--neon-cyan);text-shadow:0 0 6px var(--neon-cyan);letter-spacing:1px;}
  #healthWrap{width:180px;}
  #healthLabel{color:#9db0d0;font-size:11px;margin-bottom:4px;}
  #healthBarOuter{width:100%;height:14px;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05);}
  #healthBarInner{height:100%;width:100%;background:linear-gradient(90deg,var(--neon-pink),var(--neon-cyan));transition:width .15s;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="box" id="scoreBox">النقاط: <span id="scoreVal">0</span></div>
    <div class="box" id="healthWrap">
      <div id="healthLabel">الصحة</div>
      <div id="healthBarOuter"><div id="healthBarInner"></div></div>
    </div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>SPACE SHOOTER</h1>
    <p class="sub">حرّك مركبتك بالماوس أو الأسهم، اضغط الزر الأيسر للماوس أو مفتاح المسافة لإطلاق الليزر.
      دمّر الأعداء والنيازك قبل أن تدمّرك!</p>
    <button id="startBtn">ابدأ اللعبة</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1 style="color:var(--neon-pink);text-shadow:0 0 10px var(--neon-pink)">GAME OVER</h1>
    <div id="finalScore">النقاط النهائية: 0</div>
    <button id="restartBtn">إعادة اللعب</button>
  </div>
</div>

<script>
(function(){
  // ---- audio ----
  let actx = null;
  function ensureAudio(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    } else if(actx.state === 'suspended'){
      actx.resume();
    }
  }
  function tone(freq, dur, type, vol, sweepTo, delay){
    if(!actx) return;
    const t0 = actx.currentTime + (delay||0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, t0);
    if(sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(sweepTo,1), t0+dur);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, vol, delay){
    if(!actx) return;
    const t0 = actx.currentTime + (delay||0);
    const bufSize = actx.sampleRate*dur;
    const buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1-i/bufSize);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(vol||0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(1800, t0);
    src.connect(filter); filter.connect(gain); gain.connect(actx.destination);
    src.start(t0);
  }
  const sfx = {
    shoot(){ tone(880,0.09,'square',0.08,520); },
    hit(){ tone(220,0.08,'sawtooth',0.1,90); },
    explodeShip(){ noiseBurst(0.35,0.22); tone(160,0.3,'sawtooth',0.12,40); },
    explodeAsteroid(){ noiseBurst(0.28,0.18); tone(110,0.25,'square',0.1,30); },
    playerHit(){ tone(140,0.25,'sawtooth',0.18,50); noiseBurst(0.2,0.15,0.02); },
    gameOver(){ tone(300,0.5,'sawtooth',0.15,60); tone(200,0.6,'square',0.12,40,0.15); },
    start(){ tone(440,0.15,'triangle',0.12,880); tone(660,0.18,'triangle',0.1,1200,0.1); }
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const hud = document.getElementById('hud');
  const scoreVal = document.getElementById('scoreVal');
  const healthBarInner = document.getElementById('healthBarInner');
  const finalScore = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- state ----
  let running = false;
  let score = 0, health = 100;
  let player, bullets, enemies, particles, stars;
  let mouseX, mouseY, shooting=false;
  let keys = {};
  let lastShot = 0;
  let spawnTimer = 0, spawnInterval = 1100;
  let elapsed = 0;

  function initStars(){
    stars = [];
    for(let i=0;i<140;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,s:Math.random()*1.5+0.3});
    }
  }

  function resetGame(){
    score = 0; health = 100;
    player = {x:W/2, y:H-90, r:16, angle:0};
    bullets = []; enemies = []; particles = [];
    mouseX = W/2; mouseY = H-90;
    spawnTimer = 0; spawnInterval = 1100; elapsed = 0;
    scoreVal.textContent = '0';
    healthBarInner.style.width = '100%';
  }

  // ---- input ----
  canvas.addEventListener('mousemove', e=>{
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
  });
  canvas.addEventListener('mousedown', ()=> shooting = true);
  window.addEventListener('mouseup', ()=> shooting = false);
  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouseX = t.clientX-rect.left; mouseY = t.clientY-rect.top;
    shooting = true;
  }, {passive:false});
  canvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouseX = t.clientX-rect.left; mouseY = t.clientY-rect.top;
  }, {passive:false});
  canvas.addEventListener('touchend', ()=> shooting = false);

  window.addEventListener('keydown', e=>{
    keys[e.key] = true;
    if(e.key === ' ') shooting = true;
  });
  window.addEventListener('keyup', e=>{
    keys[e.key] = false;
    if(e.key === ' ') shooting = false;
  });

  // ---- helpers ----
  function rand(a,b){return a+Math.random()*(b-a);}

  function spawnEnemy(){
    const isAsteroid = Math.random() < 0.45;
    const r = isAsteroid ? rand(14,26) : rand(14,20);
    enemies.push({
      x: rand(r, W-r), y: -r-10,
      r, vy: rand(1.2,2.6) + elapsed*0.0004,
      vx: isAsteroid ? rand(-0.6,0.6) : 0,
      type: isAsteroid ? 'asteroid' : 'ship',
      hp: isAsteroid ? 2 : 1,
      rot: rand(0,Math.PI*2), rotSpeed: rand(-0.04,0.04),
      hue: isAsteroid ? 30 : rand(280,330)
    });
  }

  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = rand(1,5);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(20,40),maxLife:40,color});
    }
  }

  function shoot(){
    bullets.push({x:player.x, y:player.y-player.r, vy:-9});
    sfx.shoot();
  }

  // ---- update ----
  function update(dt){
    elapsed += dt;

    // move player toward mouse (smooth)
    player.x += (mouseX - player.x) * 0.18;
    player.y += (mouseY - player.y) * 0.18;

    // arrow keys
    const speed = 6;
    if(keys['ArrowLeft']) player.x -= speed;
    if(keys['ArrowRight']) player.x += speed;
    if(keys['ArrowUp']) player.y -= speed;
    if(keys['ArrowDown']) player.y += speed;

    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));

    // shooting
    if(shooting && performance.now() - lastShot > 160){
      shoot();
      lastShot = performance.now();
    }

    // bullets
    for(let i=bullets.length-1;i>=0;i--){
      bullets[i].y += bullets[i].vy;
      if(bullets[i].y < -20) bullets.splice(i,1);
    }

    // spawn
    spawnTimer += dt;
    if(spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnInterval = Math.max(420, spawnInterval - 6);
      spawnEnemy();
    }

    // enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.y += e.vy; e.x += e.vx; e.rot += e.rotSpeed;
      if(e.y - e.r > H){ enemies.splice(i,1); continue; }

      // collide with player
      const dx = e.x-player.x, dy = e.y-player.y;
      if(Math.hypot(dx,dy) < e.r+player.r-4){
        spawnParticles(e.x,e.y,'255,80,120',18);
        enemies.splice(i,1);
        health -= e.type==='asteroid'? 22:16;
        healthBarInner.style.width = Math.max(0,health)+'%';
        sfx.playerHit();
        if(health<=0){ endGame(); return; }
        continue;
      }

      // collide with bullets
      for(let j=bullets.length-1;j>=0;j--){
        const b = bullets[j];
        const dx2 = e.x-b.x, dy2 = e.y-b.y;
        if(Math.hypot(dx2,dy2) < e.r+4){
          bullets.splice(j,1);
          e.hp -= 1;
          spawnParticles(b.x,b.y, e.type==='asteroid'?'255,180,80':'0,246,255', 6);
          if(e.hp<=0){
            spawnParticles(e.x,e.y, e.type==='asteroid'?'255,140,40':'255,43,214', 24);
            enemies.splice(i,1);
            score += e.type==='asteroid'? 10:20;
            scoreVal.textContent = score;
            e.type==='asteroid' ? sfx.explodeAsteroid() : sfx.explodeShip();
          } else {
            sfx.hit();
          }
          break;
        }
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx*=0.96; p.vy*=0.96; p.life--;
      if(p.life<=0) particles.splice(i,1);
    }

    // stars
    for(const s of stars){
      s.y += s.s;
      if(s.y > H){ s.y = -2; s.x = Math.random()*W; }
    }
  }

  // ---- draw ----
  function drawShip(x,y,angle){
    ctx.save();
    ctx.translate(x,y);
    ctx.shadowColor = '#00f6ff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#0ef0ff';
    ctx.beginPath();
    ctx.moveTo(0,-18);
    ctx.lineTo(12,14);
    ctx.lineTo(0,8);
    ctx.lineTo(-12,14);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff2bd6';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // engine flame
    ctx.beginPath();
    ctx.moveTo(-5,12); ctx.lineTo(0, 12+rand(6,14)); ctx.lineTo(5,12);
    ctx.fillStyle = 'rgba(255,180,60,0.8)';
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(e.rot);
    ctx.shadowBlur = 14;
    if(e.type==='asteroid'){
      ctx.shadowColor = 'rgb(255,150,50)';
      ctx.fillStyle = '#5a3a2a';
      ctx.strokeStyle = 'rgb(255,150,50)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const spikes=7;
      for(let i=0;i<spikes;i++){
        const a = i/spikes*Math.PI*2;
        const rr = e.r*(0.75+Math.sin(i*3)*0.2);
        const px = Math.cos(a)*rr, py=Math.sin(a)*rr;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.shadowColor = 'rgb(255,43,214)';
      ctx.fillStyle = '#ff2bd6';
      ctx.beginPath();
      ctx.moveTo(0,e.r);
      ctx.lineTo(e.r,-e.r*0.7);
      ctx.lineTo(0,-e.r*0.2);
      ctx.lineTo(-e.r,-e.r*0.7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#00f6ff'; ctx.lineWidth=1.2; ctx.stroke();
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // background gradient
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0420'); g.addColorStop(1,'#05010f');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // stars
    ctx.fillStyle = '#cfe8ff';
    for(const s of stars){
      ctx.globalAlpha = 0.5+Math.random()*0.5;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.shadowColor = '#00f6ff'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#aef9ff';
    for(const b of bullets){
      ctx.fillRect(b.x-2, b.y-10, 4, 14);
    }
    ctx.shadowBlur = 0;

    // enemies
    for(const e of enemies) drawEnemy(e);

    // particles
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life/p.maxLife);
      ctx.fillStyle = `rgb(${p.color})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player
    drawShip(player.x, player.y, 0);
  }

  let lastTime = 0;
  function loop(t){
    if(!running) return;
    const dt = t - (lastTime||t);
    lastTime = t;
    update(Math.min(dt,40));
    draw();
    requestAnimationFrame(loop);
  }

  function startGame(){
    ensureAudio();
    resize();
    initStars();
    resetGame();
    running = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    lastTime = 0;
    sfx.start();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    hud.classList.add('hidden');
    finalScore.textContent = 'النقاط النهائية: ' + score;
    gameOverScreen.classList.remove('hidden');
    sfx.gameOver();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  // idle background stars on start screen
  resize(); initStars();
  function idleDraw(){
    if(running) return;
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0420'); g.addColorStop(1,'#05010f');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#cfe8ff';
    for(const s of stars){
      s.y += s.s*0.5;
      if(s.y>H){s.y=-2;s.x=Math.random()*W;}
      ctx.globalAlpha = 0.5+Math.random()*0.5;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(idleDraw);
  }
  requestAnimationFrame(idleDraw);

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
